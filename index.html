    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@200;300;400;500;600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e0e0e0;
        overflow: hidden; /* Prevent body scroll, handle in monitor */
        margin: 0;
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .font-serif {
        font-family: 'Noto Serif SC', 'Playfair Display', serif;
      }
      .font-pixel {
        font-family: 'VT323', monospace;
      }
      /* Custom scrollbar hide */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* CRT MONITOR STYLES (Balatro-like) */
      .crt-wrapper {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #080808;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Outer Bezel */
        box-shadow: inset 0 0 0 20px #1a1a1a, inset 0 0 0 25px #000; 
      }

      .crt-screen {
        position: relative;
        width: 96%;
        height: 94%;
        background-color: #050505;
        border-radius: 3rem; /* More rounded corners */
        overflow: hidden;
        /* Inner Bezel Shadow - darker and deeper */
        box-shadow: inset 0 0 40px 10px rgba(0,0,0,1);
      }

      /* Screen Bulge / Curve Simulation - Enhanced */
      .crt-curvature {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, 
            rgba(255,255,255,0) 40%, 
            rgba(0,0,0,0.2) 85%, 
            rgba(0,0,0,0.6) 95%, 
            rgba(0,0,0,0.9) 100%
        );
        pointer-events: none;
        z-index: 9990;
        border-radius: 3rem;
        /* Heavy glass reflection/vignette */
        box-shadow: inset 0 0 100px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
      }

      /* Scanlines - Animated */
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(18, 16, 16, 0),
          rgba(18, 16, 16, 0) 50%,
          rgba(0,0,0,0.3) 50%,
          rgba(0,0,0,0.3)
        );
        background-size: 100% 4px;
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        pointer-events: none;
        z-index: 9991;
        opacity: 0.4;
        animation: scanline-move 10s linear infinite;
      }

      @keyframes scanline-move {
          0% { background-position: 0 0; }
          100% { background-position: 0 100%; }
      }

      /* RGB Split / Chromatic Aberration for Text */
      .chromatic-text {
        text-shadow: 
          -2px 0 1px rgba(255,0,0,0.3),
          2px 0 1px rgba(0,255,255,0.3);
      }

      /* CRT Flicker */
      .crt-flicker {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(255, 255, 255, 0.02);
        opacity: 0;
        z-index: 9992;
        pointer-events: none;
        animation: flicker 0.15s infinite;
      }

      @keyframes flicker {
        0% { opacity: 0.02; }
        5% { opacity: 0.05; }
        10% { opacity: 0.02; }
        100% { opacity: 0.02; }
      }

      /* Glitch Keyframes */
      @keyframes glitch-anim-1 {
        0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
        20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
        60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
        80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
        100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
      }
    </style>
